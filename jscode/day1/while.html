    <meta charset="utf-8" />
    <title>Use JavaScript</title>
    <script src="./scripts/first.js"></script>

<button onclick="add()">Click Me!</button>
<script>
    let n = 0;
    function add() {
        n = Number(prompt("請輸入一個數字", "0"));
        while (n) {
            console.log(n);
            n -= 30;
            if (n <= -30) n += 35;
        }
    }
</script>
