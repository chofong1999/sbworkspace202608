<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>我的第一個頁面JS</title>
</head>

<body>
    <h1>Execute JavaScript</h1>
    <script type="text/javascript">
        function sum(n) {
            var value = 0;
            for (var i = 1; i <= n; i++) {
                value += i;
            }
            console.log(value);
            alert(value);
        }
        sum(10);
    </script>
</body>

</html>
