<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Max Number Test</title>
   
</head>

<body>
    <button onclick="test()">max</button>
    <script>
        function test() {
            let x1=parseInt(Math.random()*100)+1;
            let x2=parseInt(Math.random()*100)+1;
            let x3=parseInt(Math.random()*100)+1;
            let max=x1>x2?(x1>x3?x1:x3):(x2>x3?x2:x3);
            console.log(`x1=${x1}, x2=${x2}, x3=${x3}, max=${max}`);
        }
    </script>
</body>

</html>
