<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>jQuery Ajax</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>

<body>
    <button id="b1">x 的 y 次方</button>   
</body>
<script>   
    const power = (x, y) => {
        let result = 1;
        for (let i = 0; i < y; i++) {
            result *= x;
        }
        return result;
    };
    const start = () => {
        $("#b1").click(function () {
            const x = parseFloat(prompt("请输入底数 x:"));
            const y = parseInt(prompt("请输入指数 y:"));
            alert(`${x} 的 ${y} 次方是: ` + power(x, y));
        });
    };
    $(document).ready(start);
</script>

</html>
