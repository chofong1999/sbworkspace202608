<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>jQuery Ajax</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>

<body>
    <button id="b1">My Products</button>
    <button id="b2">Add Product</button>
    <table id="productTable" border="1" style="display: none;" width="40%">
        <tr>
            <th>Product ID</th>
            <th>Name</th>
            <th>Price</th>
        </tr>
    </table>
</body>
<script>
    const dataUrl = "http://localhost:8080/api/products";

    function onSuccess(data) {
        $("#productTable").empty();
        $("#productTable").show();
        // 第一列：標題
        var firstRow = $("<tr><th>Product ID</th><th>Name</th><th>Price</th></tr>");
        $("#productTable").append(firstRow);
        // 逐筆資料建立表格列
        $.each(data, function (i) {
            var row = $("<tr></tr>");
            var td0 = $("<td></td>").text(this.id).appendTo(row);
            var td1 = $("<td></td>").text(this.name).appendTo(row);
            var td2 = $("<td></td>").text(this.price).appendTo(row);
            $("#productTable").append(row);
        });
    }

    const start = () => {
        $("#b1").click(function () {
            $.ajax({
                method: 'GET',
                url: dataUrl,
                dataType: "json",
                success: onSuccess
            });
        });
        $("#b2").click(function () {
            $.ajax({
                method: 'POST',
                url: dataUrl,
                data: JSON.stringify({ id: -1 , name: "New Product", price: 100 }),
                contentType: "application/json",
                dataType: "json",
                success: function (data) {
                    alert("Product added: " + JSON.stringify(data));
                }
            });
        });
    };
    $(document).ready(start);
</script>

</html>
