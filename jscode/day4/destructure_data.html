<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>jQuery Ajax</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>

<body>
    <button id="b1">Destructure Data</button>
</body>
<script>   
    const greet=({ name, age })=> {
       alert(`${name} is ${age} years old.`);
    };
    const start = () => {
        $("#b1").click(function () {
            const person = { name: "Alice", city: "Taipei", age: 30 };
            greet(person);     
        });
    };
    $(document).ready(start);
</script>

</html>
