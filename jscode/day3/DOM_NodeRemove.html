<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>DOM Nodes Example</title>

</head>

<body>
    <button onclick="removeElement()">Remove element</button>
     <button onclick="rmTbChild()">Remove Table row</button>
    <ul id="firstUL">
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
        <li>Item 5</li>
    </ul>
    <table border="1" width="20%">
        <tr>
            <td>Row 1</td>
            <td>column 1</td>
            <td>column 2</td>
            <td>column 3</td>
        </tr>
        <tr>
            <td>Row 2</td>
            <td>column 1</td>
            <td>column 2</td>
            <td>column 3</td>
        </tr>
        <tr>
            <td>Row 3</td>
            <td>column 1</td>
            <td>column 2</td>
            <td>column 3</td>
        </tr>
    </table>
    <script>
        const removeElement = () => {
            var head = document.querySelector('#firstUL');
            if (head.firstChild) {
                if(head.firstChild.nodeName=="#text"){
                    let textNode = head.firstChild.nextSibling;
                    if(textNode.nodeName=="#text"){
                        head.removeChild(textNode.nextSibling);
                    }
                    head.removeChild(textNode);
                    return;
                }
                
            }
            head.removeChild(head.firstChild);
        }
        const rmTbChild = function () {
            var table = document.querySelector('table');
            table.deleteRow(0);                   // 刪第 1 列（index 從 0 開始）
        }
    </script>
</body>

</html>
