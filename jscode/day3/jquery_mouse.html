<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>jQuery Basic</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>

<body>
    <button id="b1">Class Attribute</button>
    <input type="text" id="t1" value="Input Text">
    <input type="text" id="t2" value="Input Text">
    <div id="div1" style="width:200px;height:100px;border:1px solid blue;"></div>

</body>
<script>   
    const start = () => {
        $("#b1").click(function () {
           
        });
        $("#div1").hover(
                function () { $("#div1").css("background-color", "yellow"); },
                function () { $("#div1").css("background-color", "white"); }
        );
        $("input").focus(function() { $(this).css("background-color", "yellow"); });
        $("input").blur(function() { $(this).css("background-color", "white"); });

    };
    $(document).ready(start);
</script>

</html>
