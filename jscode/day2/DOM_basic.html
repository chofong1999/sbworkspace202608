<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>DOM Basic</title>

</head>

<body>
    <button onclick="getinfo()">Get Info</button><br/>
    <button onclick="getHref()">Get Href</button><br/>
    <span id="title">DOM Title Example</span>
    <div class="item">Item 1</div>
    <div class="item">Item 2</div>
    <div class="item">Item 3</div>
    <input type="text" value="Input Text Example" />
    <div id="container">
        <a href="https://www.google.com" target="_blank">Google</a>
        <a href="https://tw.yahoo.com" target="_blank">Yahoo</a>
        <a href="https://www.bing.com" target="_blank">Bing</a>
    </div>
    <div id="innerContainer">
        <a href="api/order" target="_blank">Order</a>
        <a href="api/customer" target="_blank">Customer</a>
        <a href="api/employee" target="_blank">Employee</a>
    </div>
    <script>
        const getinfo = function () {
            const title = document.querySelector('#title');   // 等同 getElementById
            const first = document.querySelector('.item');    // 第一個 class="item"
            const input = document.querySelector('input[type="text"]');   // 屬性選擇器
            console.log('title:', title.textContent);
            console.log('first item:', first.textContent);
            console.log('input value:', input.value);
            const items = document.querySelectorAll('.item');
            items.forEach((el,index)=> console.log(index + ": " + el.textContent));
        };
        const getHref = function () {
            const parent = document.querySelector('#innerContainer');
            const links = parent.querySelectorAll('a');
            links.forEach(link => console.log(link.href));
        };
    </script>
</body>

</html>
