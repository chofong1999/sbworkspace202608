<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Array Example</title>
    
</head>

<body>
   <button onclick="showArray()">Show Array</button>
   <script>
      function showArray(){
          var a1=[1,2,3,4,5];
          for(var i=0;i<a1.length;i++){
              console.log(a1[i]);
          }
      }
   </script>
</body>

</html>
