spring.application.name=sbjpa0812

server.port=8080
############################################################
#spring.datasource.url=jdbc:mysql://localhost:3306/shop_db?useSSL=false&characterEncoding=utf8
#spring.datasource.username=root
#spring.datasource.password=1234
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
########################################################################

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:shop.db

# JPA / Hibernate update , validate , create-drop 
spring.jpa.hibernate.ddl-auto=update 

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# always , never
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode= never
spring.sql.init.schema-locations=classpath:schema.sql
#spring.sql.init.data-locations=classpath:data.sql